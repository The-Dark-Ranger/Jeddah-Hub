name: Deploy Firestore Rules

# Publishes firestore.rules / firestore.indexes.json whenever they change on
# main. Needs two repository secrets (Settings → Secrets and variables →
# Actions):
#   FIREBASE_SERVICE_ACCOUNT  JSON key of a service account with the
#                             "Firebase Rules Admin" role
#   FIREBASE_PROJECT_ID       the Firebase project ID
# Until both exist the job finishes successfully and just skips the deploy.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$SA" ] && [ -n "$PROJECT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FIREBASE_SERVICE_ACCOUNT / FIREBASE_PROJECT_ID not set; skipping the rules deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Deploy Firestore rules and indexes
        if: steps.creds.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 deploy --only firestore --project "$PROJECT" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
